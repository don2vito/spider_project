<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小红书数据采集工具</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/wordcloud2.js/1.1.2/wordcloud2.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #FF2442;
  --primary-light: #FF6B81;
  --primary-dark: #D91A37;
  --bg: #0A0A0F;
  --bg-elevated: #12121A;
  --bg-card: #1A1A25;
  --bg-card-hover: #22222F;
  --border: #2A2A3A;
  --border-light: #3A3A4A;
  --text: #EAEAF0;
  --text-secondary: #8888A0;
  --text-muted: #55556A;
  --accent-green: #00D68F;
  --accent-blue: #4C7BF4;
  --accent-yellow: #FFB800;
  --accent-purple: #A855F7;
  --accent-cyan: #06B6D4;
  --danger: #EF4444;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 4px 24px rgba(0,0,0,0.4);
  --shadow-lg: 0 8px 40px rgba(0,0,0,0.6);
  --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Noto Sans SC', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* Background atmosphere */
body::before {
  content: '';
  position: fixed;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: radial-gradient(ellipse at 20% 20%, rgba(255,36,66,0.06) 0%, transparent 50%),
              radial-gradient(ellipse at 80% 80%, rgba(76,123,244,0.04) 0%, transparent 50%),
              radial-gradient(ellipse at 50% 50%, rgba(168,85,247,0.03) 0%, transparent 60%);
  z-index: -1;
  animation: bgDrift 30s ease-in-out infinite alternate;
}

@keyframes bgDrift {
  0% { transform: translate(0, 0) rotate(0deg); }
  100% { transform: translate(-3%, -3%) rotate(2deg); }
}

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

/* Layout */
.app-container {
  max-width: 1440px;
  margin: 0 auto;
  padding: 24px;
}

/* Header */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 28px;
  padding: 20px 28px;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  backdrop-filter: blur(20px);
}

.logo {
  display: flex;
  align-items: center;
  gap: 14px;
}

.logo-icon {
  width: 44px;
  height: 44px;
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  font-weight: 900;
  color: white;
  box-shadow: 0 4px 16px rgba(255,36,66,0.3);
}

.logo-text h1 {
  font-family: 'Space Grotesk', 'Noto Sans SC', sans-serif;
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.5px;
  background: linear-gradient(135deg, var(--text), var(--text-secondary));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.logo-text p {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 2px;
}

/* Status badge */
.status-badge {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 16px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 500;
  border: 1px solid var(--border);
  background: var(--bg-card);
}

.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--text-muted);
  transition: var(--transition);
}

.status-dot.connected {
  background: var(--accent-green);
  box-shadow: 0 0 8px rgba(0,214,143,0.5);
  animation: pulse 2s ease-in-out infinite;
}

.status-dot.error {
  background: var(--danger);
  box-shadow: 0 0 8px rgba(239,68,68,0.5);
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

/* Cookie Section */
.cookie-section {
  margin-bottom: 24px;
  padding: 20px 24px;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}

.cookie-section label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  margin-bottom: 10px;
}

.cookie-row {
  display: flex;
  gap: 12px;
  align-items: stretch;
}

.cookie-input {
  flex: 1;
  padding: 12px 16px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-size: 13px;
  font-family: 'Space Grotesk', monospace;
  resize: horizontal;
  min-height: 44px;
  max-height: 80px;
  transition: var(--transition);
}

.cookie-input:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(255,36,66,0.15);
}

.cookie-input::placeholder {
  color: var(--text-muted);
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 20px;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-weight: 600;
  font-family: 'Noto Sans SC', sans-serif;
  cursor: pointer;
  transition: var(--transition);
  white-space: nowrap;
  position: relative;
  overflow: hidden;
}

.btn:active { transform: scale(0.97); }

.btn-primary {
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  color: white;
  box-shadow: 0 4px 16px rgba(255,36,66,0.25);
}

.btn-primary:hover {
  box-shadow: 0 6px 24px rgba(255,36,66,0.35);
  transform: translateY(-1px);
}

.btn-secondary {
  background: var(--bg-card);
  color: var(--text);
  border: 1px solid var(--border);
}

.btn-secondary:hover {
  background: var(--bg-card-hover);
  border-color: var(--border-light);
}

.btn-accent {
  background: linear-gradient(135deg, var(--accent-blue), #6C8FF8);
  color: white;
  box-shadow: 0 4px 16px rgba(76,123,244,0.25);
}

.btn-accent:hover {
  box-shadow: 0 6px 24px rgba(76,123,244,0.35);
  transform: translateY(-1px);
}

.btn-success {
  background: linear-gradient(135deg, var(--accent-green), #00F0A0);
  color: #0A0A0F;
  box-shadow: 0 4px 16px rgba(0,214,143,0.25);
}

.btn-success:hover {
  box-shadow: 0 6px 24px rgba(0,214,143,0.35);
  transform: translateY(-1px);
}

.btn-sm {
  padding: 6px 14px;
  font-size: 12px;
  border-radius: 6px;
}

.btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none !important;
}

.btn .spinner {
  width: 16px;
  height: 16px;
  border: 2px solid transparent;
  border-top-color: currentColor;
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* Search Section */
.search-section {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 24px;
}

.search-card {
  padding: 20px 24px;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  transition: var(--transition);
}

.search-card:hover {
  border-color: var(--border-light);
}

.search-card h3 {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.search-card h3 .icon {
  font-size: 18px;
}

.search-row {
  display: flex;
  gap: 10px;
}

.search-input {
  flex: 1;
  padding: 10px 16px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-size: 14px;
  font-family: 'Noto Sans SC', sans-serif;
  transition: var(--transition);
}

.search-input:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(255,36,66,0.15);
}

.search-input::placeholder { color: var(--text-muted); }

/* Toolbar */
.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
  padding: 16px 24px;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  flex-wrap: wrap;
  gap: 12px;
}

.toolbar-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.toolbar-right {
  display: flex;
  align-items: center;
  gap: 10px;
}

.result-count {
  font-size: 14px;
  color: var(--text-secondary);
}

.result-count strong {
  color: var(--primary);
  font-weight: 700;
}

.sort-select {
  padding: 8px 14px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-size: 13px;
  font-family: 'Noto Sans SC', sans-serif;
  cursor: pointer;
  transition: var(--transition);
}

.sort-select:focus {
  outline: none;
  border-color: var(--primary);
}

.sort-select option {
  background: var(--bg-card);
  color: var(--text);
}

/* Table */
.table-container {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}

.table-wrapper {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
}

thead {
  background: var(--bg-card);
}

th {
  padding: 14px 16px;
  text-align: left;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}

td {
  padding: 14px 16px;
  font-size: 13px;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
}

tr:last-child td { border-bottom: none; }

tr:hover td {
  background: rgba(255,255,255,0.02);
}

.note-cover {
  width: 56px;
  height: 56px;
  border-radius: 8px;
  object-fit: cover;
  background: var(--bg-card);
  border: 1px solid var(--border);
}

.note-title {
  font-weight: 500;
  color: var(--text);
  max-width: 280px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.note-title a {
  color: var(--text);
  text-decoration: none;
  transition: var(--transition);
}

.note-title a:hover {
  color: var(--primary);
}

.note-author {
  color: var(--text-secondary);
  font-size: 12px;
}

.note-time {
  color: var(--text-secondary);
  font-size: 12px;
  white-space: nowrap;
}

.note-type {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 10px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 600;
}

.note-type.video {
  background: rgba(76,123,244,0.15);
  color: var(--accent-blue);
}

.note-type.normal {
  background: rgba(168,85,247,0.15);
  color: var(--accent-purple);
}

.stat-num {
  font-family: 'Space Grotesk', monospace;
  font-weight: 600;
  font-size: 13px;
}

.stat-num.likes { color: var(--primary-light); }
.stat-num.favorites { color: var(--accent-yellow); }
.stat-num.comments { color: var(--accent-cyan); }

/* Empty state */
.empty-state {
  text-align: center;
  padding: 80px 40px;
  color: var(--text-muted);
}

.empty-state .icon {
  font-size: 48px;
  margin-bottom: 16px;
  opacity: 0.5;
}

.empty-state p {
  font-size: 15px;
}

/* Loading overlay */
.loading-overlay {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(10,10,15,0.8);
  backdrop-filter: blur(8px);
  z-index: 1000;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 20px;
}

.loading-overlay.active {
  display: flex;
}

.loading-spinner {
  width: 48px;
  height: 48px;
  border: 3px solid var(--border);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

.loading-text {
  font-size: 15px;
  color: var(--text-secondary);
}

.loading-progress {
  font-size: 13px;
  color: var(--text-muted);
}

/* Modal */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(10,10,15,0.85);
  backdrop-filter: blur(12px);
  z-index: 900;
  align-items: center;
  justify-content: center;
}

.modal-overlay.active {
  display: flex;
}

.modal {
  width: 90%;
  max-width: 1100px;
  max-height: 85vh;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  box-shadow: var(--shadow-lg);
  animation: modalIn 0.3s ease-out;
}

@keyframes modalIn {
  from { opacity: 0; transform: scale(0.95) translateY(20px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 28px;
  border-bottom: 1px solid var(--border);
}

.modal-header h2 {
  font-size: 18px;
  font-weight: 700;
}

.modal-close {
  width: 36px;
  height: 36px;
  border: none;
  background: var(--bg-card);
  border-radius: 8px;
  color: var(--text-secondary);
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: var(--transition);
}

.modal-close:hover {
  background: var(--danger);
  color: white;
}

.modal-body {
  padding: 24px 28px;
  overflow-y: auto;
  flex: 1;
}

/* Tabs */
.tabs {
  display: flex;
  gap: 4px;
  margin-bottom: 24px;
  background: var(--bg-card);
  border-radius: var(--radius-sm);
  padding: 4px;
}

.tab-btn {
  flex: 1;
  padding: 10px 16px;
  border: none;
  background: transparent;
  color: var(--text-secondary);
  font-size: 13px;
  font-weight: 500;
  font-family: 'Noto Sans SC', sans-serif;
  cursor: pointer;
  border-radius: 6px;
  transition: var(--transition);
}

.tab-btn.active {
  background: var(--primary);
  color: white;
  box-shadow: 0 2px 8px rgba(255,36,66,0.3);
}

.tab-btn:hover:not(.active) {
  color: var(--text);
  background: rgba(255,255,255,0.05);
}

.tab-content { display: none; }
.tab-content.active { display: block; }

/* Stats cards */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}

.stat-card {
  padding: 20px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  transition: var(--transition);
}

.stat-card:hover {
  border-color: var(--border-light);
  transform: translateY(-2px);
}

.stat-card .label {
  font-size: 12px;
  color: var(--text-muted);
  margin-bottom: 8px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.stat-card .value {
  font-family: 'Space Grotesk', monospace;
  font-size: 28px;
  font-weight: 700;
}

.stat-card .value.red { color: var(--primary); }
.stat-card .value.yellow { color: var(--accent-yellow); }
.stat-card .value.blue { color: var(--accent-blue); }
.stat-card .value.green { color: var(--accent-green); }
.stat-card .value.purple { color: var(--accent-purple); }
.stat-card .value.cyan { color: var(--accent-cyan); }

/* Charts */
.chart-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-bottom: 20px;
}

.chart-box {
  padding: 20px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}

.chart-box h4 {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 16px;
}

.chart-box canvas {
  max-height: 300px;
}

/* Word cloud */
.wordcloud-container {
  position: relative;
  width: 100%;
  height: 350px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}

.wordcloud-container canvas {
  width: 100% !important;
  height: 100% !important;
}

/* Keywords list */
.keywords-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 8px;
  margin-top: 16px;
}

.keyword-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 14px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 13px;
}

.keyword-item .word {
  color: var(--text);
  font-weight: 500;
}

.keyword-item .count {
  font-family: 'Space Grotesk', monospace;
  color: var(--primary-light);
  font-size: 12px;
}

/* Toast */
.toast-container {
  position: fixed;
  top: 24px;
  right: 24px;
  z-index: 2000;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.toast {
  padding: 14px 20px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 13px;
  color: var(--text);
  box-shadow: var(--shadow);
  animation: toastIn 0.3s ease-out;
  max-width: 400px;
}

.toast.success { border-left: 3px solid var(--accent-green); }
.toast.error { border-left: 3px solid var(--danger); }
.toast.info { border-left: 3px solid var(--accent-blue); }

@keyframes toastIn {
  from { opacity: 0; transform: translateX(40px); }
  to { opacity: 1; transform: translateX(0); }
}

/* Pagination */
.pagination {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 16px;
}

/* Responsive */
@media (max-width: 768px) {
  .app-container { padding: 12px; }
  .search-section { grid-template-columns: 1fr; }
  .chart-row { grid-template-columns: 1fr; }
  .header { flex-direction: column; gap: 12px; }
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
  .toolbar { flex-direction: column; align-items: stretch; }
  .toolbar-left, .toolbar-right { justify-content: center; }
}

/* Load more button area */
.load-more-area {
  text-align: center;
  padding: 20px;
}
</style>
</head>
<body>

<div class="toast-container" id="toastContainer"></div>

<!-- Loading Overlay -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-spinner"></div>
  <div class="loading-text" id="loadingText">正在加载数据...</div>
  <div class="loading-progress" id="loadingProgress"></div>
</div>

<!-- Analysis Modal -->
<div class="modal-overlay" id="analysisModal">
  <div class="modal">
    <div class="modal-header">
      <h2>📊 数据分析</h2>
      <button class="modal-close" onclick="closeAnalysisModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('stats')">基础统计</button>
        <button class="tab-btn" onclick="switchTab('interaction')">互动分析</button>
        <button class="tab-btn" onclick="switchTab('wordcloud')">词云关键词</button>
        <button class="tab-btn" onclick="switchTab('trend')">时间趋势</button>
      </div>

      <div class="tab-content active" id="tab-stats">
        <div class="stats-grid" id="statsGrid"></div>
        <div class="chart-row">
          <div class="chart-box">
            <h4>📈 TOP10 笔记互动数据</h4>
            <canvas id="topNotesChart"></canvas>
          </div>
          <div class="chart-box">
            <h4>🎯 情感分布</h4>
            <canvas id="sentimentChart"></canvas>
          </div>
        </div>
      </div>

      <div class="tab-content" id="tab-interaction">
        <div class="chart-row">
          <div class="chart-box">
            <h4>❤️ 点赞数分布</h4>
            <canvas id="likesDistChart"></canvas>
          </div>
          <div class="chart-box">
            <h4>⭐ 收藏数分布</h4>
            <canvas id="favDistChart"></canvas>
          </div>
        </div>
      </div>

      <div class="tab-content" id="tab-wordcloud">
        <div class="wordcloud-container">
          <canvas id="wordcloudCanvas"></canvas>
        </div>
        <div class="keywords-list" id="keywordsList"></div>
      </div>

      <div class="tab-content" id="tab-trend">
        <div class="chart-box">
          <h4>📅 发布时间趋势</h4>
          <canvas id="timeTrendChart"></canvas>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Main App -->
<div class="app-container">

  <!-- Header -->
  <div class="header">
    <div class="logo">
      <div class="logo-icon">RED</div>
      <div class="logo-text">
        <h1>XHS Data Scraper</h1>

      </div>
    </div>
    <div class="status-badge">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">未连接</span>
    </div>
  </div>

  <!-- Cookie Section -->
  <div class="cookie-section">
    <label>🔐 请先设置小红书Cookie（在浏览器登录后，使用Cookie导出工具获取完整Cookie字符串）</label>
    <div class="cookie-row">
      <textarea class="cookie-input" id="cookieInput" placeholder="粘贴完整的Cookie字符串到这里... (例如: a1=xxx; webId=xxx; web_session=xxx ...)"></textarea>
      <button class="btn btn-primary" id="cookieBtn" onclick="setCookie()">
        设置Cookie
      </button>
    </div>
  </div>

  <!-- Search Section -->
  <div class="search-section">
    <div class="search-card">
      <h3><span class="icon">🔍</span> 关键词搜索</h3>
      <div class="search-row">
        <input type="text" class="search-input" id="keywordInput" placeholder="输入关键词搜索笔记标题..." onkeydown="if(event.key==='Enter')searchByKeyword()">
        <button class="btn btn-primary" onclick="searchByKeyword()">搜索</button>
      </div>
    </div>
    <div class="search-card">
      <h3><span class="icon">👤</span> 小红书号搜索</h3>
      <div class="search-row">
        <input type="text" class="search-input" id="authorInput" placeholder="输入小红书号或用户ID（如 5a3e3f4e000000000d01b5c8）..." onkeydown="if(event.key==='Enter')searchByXhsId()">
        <button class="btn btn-accent" onclick="searchByXhsId()">搜索</button>
      </div>
    </div>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <div class="toolbar-left">
      <span class="result-count">共找到 <strong id="resultCount">0</strong> 条笔记</span>

        <option value="desc">发布时间 ↓ 降序</option>
        <option value="asc">发布时间 ↑ 升序</option>
        <option value="likes_desc">点赞数 ↓ 降序</option>
        <option value="likes_asc">点赞数 ↑ 升序</option>
      </select>

    <div class="toolbar-right">
      <button class="btn btn-success" id="downloadAllBtn" onclick="downloadAll()" disabled>
        📦 下载全部
      </button>

        📊 数据分析
      </button>

  <!-- Results Table -->
  <div class="table-container">
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th style="width:70px">#</th>
            <th style="width:70px">封面</th>
            <th>标题</th>
            <th style="width:100px">作者</th>
            <th style="width:110px">发布时间</th>
            <th style="width:60px">类型</th>
            <th style="width:70px">❤️ 点赞</th>
            <th style="width:70px">⭐ 收藏</th>
            <th style="width:70px">💬 评论</th>
            <th style="width:100px">操作</th>
          </tr>
        </thead>
        <tbody id="resultsBody">
        </tbody>
      </table>
    </div>

    <!-- Empty state -->
    <div class="empty-state" id="emptyState">
      <div class="icon">🔎</div>
      <p>输入关键词或作者名开始搜索</p>
    </div>

    <!-- Load more -->
    <div class="load-more-area" id="loadMoreArea" style="display:none;">
      <button class="btn btn-secondary" id="loadMoreBtn" onclick="loadMore()">加载更多...</button>
    </div>
  </div>

</div>

<script>
// ─── State ──────────────────────────────────────────────
let allNotes = [];
let currentPage = 1;
let currentSort = 'desc';
let searchKeyword = '';
let hasMore = false;
let chartInstances = {};

// ─── Toast Notifications ────────────────────────────────
function showToast(message, type = 'info') {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.textContent = message;
  container.appendChild(toast);
  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transform = 'translateX(40px)';
    toast.style.transition = 'all 0.3s ease';
    setTimeout(() => toast.remove(), 300);
  }, 3500);
}

// ─── Loading ────────────────────────────────────────────
function showLoading(text = '正在加载数据...', progress = '') {
  document.getElementById('loadingText').textContent = text;
  document.getElementById('loadingProgress').textContent = progress;
  document.getElementById('loadingOverlay').classList.add('active');
}

function updateLoading(text, progress) {
  document.getElementById('loadingText').textContent = text;
  document.getElementById('loadingProgress').textContent = progress;
}

function hideLoading() {
  document.getElementById('loadingOverlay').classList.remove('active');
}

// ─── Cookie Management ──────────────────────────────────
async function setCookie() {
  const cookie = document.getElementById('cookieInput').value.trim();
  if (!cookie) {
    showToast('请输入Cookie字符串', 'error');
    return;
  }

  const btn = document.getElementById('cookieBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> 验证中...';

  try {
    const resp = await fetch('/api/cookie', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ cookie })
    });

    const data = await resp.json();

    if (data.status === 'ok') {
      document.getElementById('statusDot').className = 'status-dot connected';
      document.getElementById('statusText').textContent = '已连接';
      showToast(data.message || 'Cookie设置成功！', 'success');
    } else {
      document.getElementById('statusDot').className = 'status-dot error';
      document.getElementById('statusText').textContent = '连接失败';
      showToast(data.message || data.error || 'Cookie验证失败', 'error');
    }
  } catch (e) {
    document.getElementById('statusDot').className = 'status-dot error';
    document.getElementById('statusText').textContent = '服务未启动';
    showToast('无法连接到服务器，请确保代理服务已启动', 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '设置Cookie';
  }
}

// ─── Search by Keyword ──────────────────────────────────
async function searchByKeyword(page = 1) {
  const keyword = document.getElementById('keywordInput').value.trim();
  if (!keyword) {
    showToast('请输入搜索关键词', 'error');
    return;
  }

  if (page === 1) {
    allNotes = [];
    currentPage = 1;
    searchKeyword = keyword;
  }

  showLoading('正在搜索笔记...', `关键词: ${keyword} · 第 ${page} 页`);

  try {
    const resp = await fetch('/api/search', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        keyword,
        page,
        page_size: 20,
        sort: 'general'
      })
    });

    const data = await resp.json();

    if (data.error) {
      showToast(data.message || data.error, 'error');
      hideLoading();
      return;
    }

    const items = data.items || [];
    allNotes = allNotes.concat(items);
    hasMore = data.has_more;
    currentPage = page;

    renderTable();
    document.getElementById('loadMoreArea').style.display = hasMore ? 'block' : 'none';
    showToast(`找到 ${allNotes.length} 条笔记`, 'success');

  } catch (e) {
    showToast('搜索失败: ' + e.message, 'error');
  } finally {
    hideLoading();
  }
}

async function loadMore() {
  if (searchKeyword) {
    await searchByKeyword(currentPage + 1);
  }
}

// ─── Search by XHS ID (user_id) ──────────────────────
async function searchByXhsId() {
  const xhsId = document.getElementById('authorInput').value.trim();
  if (!xhsId) {
    showToast('请输入小红书号或用户ID', 'error');
    return;
  }

  showLoading('正在获取用户信息...', `ID: ${xhsId}`);

  try {
    // Step 1: Get user info to verify the ID and show nickname
    let nickname = '';
    try {
      const infoResp = await fetch(`/api/user/${encodeURIComponent(xhsId)}/info`);
      if (infoResp.ok) {
        const infoData = await infoResp.json();
        if (infoData.error) {
          showToast(infoData.message || infoData.error, 'error');
          hideLoading();
          return;
        }
        nickname = infoData.nickname || xhsId;
        showToast(`找到用户: ${nickname}`, 'info');
      } else {
        const err = await infoResp.json();
        showToast(err.message || '用户不存在，请检查ID', 'error');
        hideLoading();
        return;
      }
    } catch (e) {
      // If user info fails, still try to get notes with the raw ID
      nickname = xhsId;
    }

    // Step 2: Get all notes from user by cursor pagination
    allNotes = [];
    let cursor = '';
    let pageNum = 1;
    let hasMoreNotes = true;

    while (hasMoreNotes) {
      updateLoading(`正在获取 ${nickname} 的笔记...`, `第 ${pageNum} 页`);

      const notesResp = await fetch(`/api/user/${encodeURIComponent(xhsId)}/notes?cursor=${encodeURIComponent(cursor)}&num=30`);
      const notesData = await notesResp.json();

      if (notesData.error) {
        showToast(notesData.message || notesData.error, 'error');
        break;
      }

      const notes = notesData.notes || [];
      allNotes = allNotes.concat(notes);
      hasMoreNotes = notesData.has_more;
      cursor = notesData.cursor || '';
      pageNum++;

      if (!hasMoreNotes || !notes.length) break;
      // Small delay between pages
      await new Promise(r => setTimeout(r, 500));
    }

    hasMore = false;
    renderTable();
    document.getElementById('loadMoreArea').style.display = 'none';
    showToast(`共获取 ${allNotes.length} 条笔记`, 'success');

  } catch (e) {
    showToast('搜索失败: ' + e.message, 'error');
  } finally {
    hideLoading();
  }
}

// ─── Render Table ───────────────────────────────────────
function renderTable() {
  const tbody = document.getElementById('resultsBody');
  const emptyState = document.getElementById('emptyState');
  const countEl = document.getElementById('resultCount');
  const dlAllBtn = document.getElementById('downloadAllBtn');
  const analyzeBtn = document.getElementById('analyzeBtn');

  countEl.textContent = allNotes.length;

  if (!allNotes.length) {
    tbody.innerHTML = '';
    emptyState.style.display = 'block';
    dlAllBtn.disabled = true;
    analyzeBtn.disabled = true;
    return;
  }

  emptyState.style.display = 'none';
  dlAllBtn.disabled = false;
  analyzeBtn.disabled = false;

  // Sort
  const sorted = [...allNotes].sort((a, b) => {
    switch (currentSort) {
      case 'asc': return (a.time || 0) - (b.time || 0);
      case 'desc': return (b.time || 0) - (a.time || 0);
      case 'likes_asc': return parseInt(a.interact_info?.liked_count || 0) - parseInt(b.interact_info?.liked_count || 0);
      case 'likes_desc': return parseInt(b.interact_info?.liked_count || 0) - parseInt(a.interact_info?.liked_count || 0);
      default: return 0;
    }
  });

  tbody.innerHTML = sorted.map((note, idx) => {
    const timeStr = note.time ? new Date(note.time).toLocaleString('zh-CN') : '-';
    const typeClass = note.type === 'video' ? 'video' : 'normal';
    const typeLabel = note.type === 'video' ? '🎬 视频' : '🖼️ 图文';
    const likes = note.interact_info?.liked_count || '0';
    const favs = note.interact_info?.collected_count || '0';
    const comms = note.interact_info?.comment_count || '0';
    const coverUrl = note.cover?.url || '';
    const noteUrl = `https://www.xiaohongshu.com/explore/${note.note_id}`;
    const authorName = note.user?.nickname || '-';

    return `<tr>
      <td style="color:var(--text-muted);font-family:'Space Grotesk',monospace;">${idx + 1}</td>
      <td>${coverUrl ? `<img class="note-cover" src="${coverUrl}" onerror="this.style.display='none'" loading="lazy">` : '<div class="note-cover"></div>'}</td>
      <td class="note-title"><a href="${noteUrl}" target="_blank" title="${escapeHtml(note.title || '')}">${escapeHtml(note.title || '无标题')}</a></td>
      <td class="note-author">${escapeHtml(authorName)}</td>
      <td class="note-time">${timeStr}</td>
      <td><span class="note-type ${typeClass}">${typeLabel}</span></td>
      <td class="stat-num likes">${formatNum(likes)}</td>
      <td class="stat-num favorites">${formatNum(favs)}</td>
      <td class="stat-num comments">${formatNum(comms)}</td>
      <td><button class="btn btn-sm btn-secondary" onclick="downloadNote('${note.note_id}','${note.xsec_token || ''}')">⬇ 下载</button></td>
    </tr>`;
  }).join('');
}

function sortResults() {
  currentSort = document.getElementById('sortSelect').value;
  renderTable();
}

// ─── Download Single Note ───────────────────────────────
async function downloadNote(noteId, xsecToken) {
  showLoading('正在打包笔记...', `笔记ID: ${noteId.substring(0, 8)}...`);

  try {
    const resp = await fetch(`/api/download/note/${noteId}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ xsec_token: xsecToken, with_comments: true })
    });

    if (!resp.ok) {
      const err = await resp.json();
      showToast(err.message || err.error || '下载失败', 'error');
      hideLoading();
      return;
    }

    const blob = await resp.blob();
    saveAs(blob, `note_${noteId}.zip`);
    showToast('下载完成！', 'success');

  } catch (e) {
    showToast('下载失败: ' + e.message, 'error');
  } finally {
    hideLoading();
  }
}

// ─── Download All ───────────────────────────────────────
async function downloadAll() {
  if (!allNotes.length) {
    showToast('没有可下载的笔记', 'error');
    return;
  }

  const confirmed = confirm(`确定要下载全部 ${allNotes.length} 条笔记吗？\n\n注意：批量下载可能需要较长时间，请耐心等待。`);
  if (!confirmed) return;

  showLoading('正在批量打包...', `共 ${allNotes.length} 条笔记`);

  try {
    const notes = allNotes.map(n => ({
      note_id: n.note_id,
      xsec_token: n.xsec_token || ''
    }));

    const resp = await fetch('/api/download/batch', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ notes })
    });

    if (!resp.ok) {
      const err = await resp.json();
      showToast(err.message || err.error || '下载失败', 'error');
      hideLoading();
      return;
    }

    const blob = await resp.blob();
    saveAs(blob, `xhs_batch_${Date.now()}.zip`);
    showToast('批量下载完成！', 'success');

  } catch (e) {
    showToast('批量下载失败: ' + e.message, 'error');
  } finally {
    hideLoading();
  }
}

// ─── Data Analysis ──────────────────────────────────────
async function analyzeData() {
  if (!allNotes.length) {
    showToast('没有可分析的数据', 'error');
    return;
  }

  showLoading('正在获取笔记详情...', `共 ${allNotes.length} 条笔记`);

  try {
    // Fetch detailed info for each note (needed for full analysis)
    const detailedNotes = [];
    for (let i = 0; i < allNotes.length; i++) {
      const note = allNotes[i];
      updateLoading('正在获取笔记详情...', `${i + 1} / ${allNotes.length}`);

      try {
        const resp = await fetch(`/api/note/${note.note_id}?xsec_token=${encodeURIComponent(note.xsec_token || '')}`);
        if (resp.ok) {
          const detail = await resp.json();
          detailedNotes.push(detail);
        }
      } catch (e) {
        // Use basic note data as fallback
        detailedNotes.push(note);
      }

      // Rate limit: wait between requests
      if (i < allNotes.length - 1) {
        await new Promise(r => setTimeout(r, 2500));
      }
    }

    updateLoading('正在进行数据分析...', '请稍候');

    const resp = await fetch('/api/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ notes: detailedNotes })
    });

    const analysis = await resp.json();

    if (analysis.error) {
      showToast(analysis.error, 'error');
      hideLoading();
      return;
    }

    renderAnalysis(analysis);
    openAnalysisModal();
    showToast('数据分析完成！', 'success');

  } catch (e) {
    showToast('分析失败: ' + e.message, 'error');
  } finally {
    hideLoading();
  }
}

function openAnalysisModal() {
  document.getElementById('analysisModal').classList.add('active');
}

function closeAnalysisModal() {
  document.getElementById('analysisModal').classList.remove('active');
  // Destroy chart instances to prevent memory leaks
  Object.values(chartInstances).forEach(c => c.destroy());
  chartInstances = {};
}

function switchTab(tabName) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

  event.target.classList.add('active');
  document.getElementById(`tab-${tabName}`).classList.add('active');
}

function renderAnalysis(data) {
  // Destroy existing charts
  Object.values(chartInstances).forEach(c => c.destroy());
  chartInstances = {};

  const { stats, word_freq, time_distribution, sentiment, top_keywords, top_notes } = data;

  // ─── Stats Cards ────────────────────────────────────
  document.getElementById('statsGrid').innerHTML = `
    <div class="stat-card"><div class="label">📝 总笔记数</div><div class="value red">${stats.total_notes}</div></div>
    <div class="stat-card"><div class="label">❤️ 总点赞数</div><div class="value yellow">${formatNum(stats.total_likes)}</div></div>
    <div class="stat-card"><div class="label">⭐ 总收藏数</div><div class="value blue">${formatNum(stats.total_favorites)}</div></div>
    <div class="stat-card"><div class="label">💬 总评论数</div><div class="value cyan">${formatNum(stats.total_comments)}</div></div>
    <div class="stat-card"><div class="label">📊 平均点赞</div><div class="value green">${stats.avg_likes}</div></div>
    <div class="stat-card"><div class="label">📊 平均收藏</div><div class="value purple">${stats.avg_favorites}</div></div>
  `;

  // ─── Top Notes Chart ────────────────────────────────
  if (top_notes && top_notes.length) {
    const ctx = document.getElementById('topNotesChart').getContext('2d');
    chartInstances.topNotes = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: top_notes.map(n => n.title.substring(0, 15) + (n.title.length > 15 ? '...' : '')),
        datasets: [
          { label: '点赞', data: top_notes.map(n => n.likes), backgroundColor: 'rgba(255,36,66,0.7)', borderRadius: 4 },
          { label: '收藏', data: top_notes.map(n => n.favorites), backgroundColor: 'rgba(255,184,0,0.7)', borderRadius: 4 },
          { label: '评论', data: top_notes.map(n => n.comments), backgroundColor: 'rgba(6,182,212,0.7)', borderRadius: 4 },
        ]
      },
      options: {
        responsive: true,
        plugins: { legend: { labels: { color: '#8888A0', font: { size: 11 } } } },
        scales: {
          x: { ticks: { color: '#55556A', font: { size: 10 } }, grid: { color: 'rgba(255,255,255,0.05)' } },
          y: { ticks: { color: '#55556A' }, grid: { color: 'rgba(255,255,255,0.05)' } }
        }
      }
    });
  }

  // ─── Sentiment Pie ─────────────────────────────────
  if (sentiment) {
    const ctx = document.getElementById('sentimentChart').getContext('2d');
    chartInstances.sentiment = new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: ['😊 正面', '😐 中性', '😞 负面'],
        datasets: [{
          data: [sentiment.score_distribution.positive, sentiment.score_distribution.neutral, sentiment.score_distribution.negative],
          backgroundColor: ['#00D68F', '#FFB800', '#EF4444'],
          borderWidth: 0,
          hoverOffset: 8
        }]
      },
      options: {
        responsive: true,
        cutout: '55%',
        plugins: {
          legend: { position: 'bottom', labels: { color: '#8888A0', padding: 16, font: { size: 12 } } }
        }
      }
    });
  }

  // ─── Word Cloud ────────────────────────────────────
  if (word_freq && word_freq.length) {
    const canvas = document.getElementById('wordcloudCanvas');
    const maxCount = word_freq[0]?.count || 1;

    WordCloud(canvas, {
      list: word_freq.map(w => [w.word, w.count]),
      gridSize: Math.round(16 * canvas.offsetWidth / 1024),
      weightFactor: (size) => Math.max(14, size * 60 / maxCount),
      fontFamily: 'Noto Sans SC, sans-serif',
      fontWeight: 700,
      color: () => {
        const colors = ['#FF2442', '#FF6B81', '#FFB800', '#4C7BF4', '#A855F7', '#06B6D4', '#00D68F'];
        return colors[Math.floor(Math.random() * colors.length)];
      },
      backgroundColor: 'transparent',
      rotateRatio: 0.3,
      rotationSteps: 2,
    });
  }

  // ─── Keywords List ─────────────────────────────────
  if (top_keywords && top_keywords.length) {
    document.getElementById('keywordsList').innerHTML = top_keywords.map((kw, i) => `
      <div class="keyword-item">
        <span class="word">${i + 1}. ${escapeHtml(kw.word)}</span>
        <span class="count">${kw.count}次</span>
      </div>
    `).join('');
  }

  // ─── Time Trend ────────────────────────────────────
  if (time_distribution && time_distribution.labels.length) {
    const ctx = document.getElementById('timeTrendChart').getContext('2d');
    chartInstances.timeTrend = new Chart(ctx, {
      type: 'line',
      data: {
        labels: time_distribution.labels,
        datasets: [
          {
            label: '笔记数量',
            data: time_distribution.note_counts,
            borderColor: '#FF2442',
            backgroundColor: 'rgba(255,36,66,0.1)',
            fill: true,
            tension: 0.4,
            yAxisID: 'y',
          },
          {
            label: '点赞数',
            data: time_distribution.like_counts,
            borderColor: '#FFB800',
            backgroundColor: 'rgba(255,184,0,0.1)',
            fill: true,
            tension: 0.4,
            yAxisID: 'y1',
          }
        ]
      },
      options: {
        responsive: true,
        interaction: { mode: 'index', intersect: false },
        plugins: { legend: { labels: { color: '#8888A0' } } },
        scales: {
          x: { ticks: { color: '#55556A' }, grid: { color: 'rgba(255,255,255,0.05)' } },
          y: { position: 'left', title: { display: true, text: '笔记数', color: '#8888A0' }, ticks: { color: '#55556A' }, grid: { color: 'rgba(255,255,255,0.05)' } },
          y1: { position: 'right', title: { display: true, text: '点赞数', color: '#8888A0' }, ticks: { color: '#55556A' }, grid: { drawOnChartArea: false } }

  }
}

// ─── Utilities ──────────────────────────────────────────
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function formatNum(n) {
  const num = parseInt(n) || 0;
  if (num >= 10000) return (num / 10000).toFixed(1) + 'w';
  if (num >= 1000) return (num / 1000).toFixed(1) + 'k';
  return num.toString();
}

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

// ─── Init: Check server status ─────────────────────────
(async function init() {
  try {
    const resp = await fetch('/api/cookie/status');
    const data = await resp.json();
    if (data.cookie_valid) {
      document.getElementById('statusDot').className = 'status-dot connected';
      document.getElementById('statusText').textContent = '已连接';
    } else if (data.sign_server) {
      document.getElementById('statusDot').className = 'status-dot error';
      document.getElementById('statusText').textContent = '请设置Cookie';
    } else {
      document.getElementById('statusDot').className = 'status-dot error';
      document.getElementById('statusText').textContent = '签名服务未启动';
    }
  } catch (e) {
    document.getElementById('statusDot').className = 'status-dot error';
    document.getElementById('statusText').textContent = '服务未启动';
  }
})();
</script>
